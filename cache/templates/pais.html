<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ country.name }} · S.I. News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
  <a href="{{ url_for('index') }}" class="kicker" style="text-decoration:none;">← Voltar</a>
  <h1 style="font-size: clamp(1.8rem, 4vw, 3rem); text-align:left; max-width:900px; margin: 24px auto 0;">
    {{ country.name }} <em style="font-size:0.5em; color:var(--muted); font-style:normal;">({{ country.code }})</em>
  </h1>
  <p class="sub" style="text-align:left; max-width:900px; margin: 14px auto 0;">
    {{ country.city }} · idioma {{ country.language }} · {{ country.count }} notícias
  </p>
</header>

<main style="max-width:900px; margin:0 auto;">
  {% for a in country.articles %}
  <article class="card" style="min-height:auto; margin-bottom:14px; padding: 22px 24px;">
    <span class="tag" data-color="{% if loop.index0 % 3 == 0 %}red{% elif loop.index0 % 3 == 1 %}green{% else %}gold{% endif %}">
      {{ a.source }}
    </span>
    <h2 style="font-size:1.15rem; margin-bottom:14px;">{{ a.title }}</h2>
    <div class="meta" style="margin-top:0;">
      <span class="source">{{ a.date }}</span>
      <a href="{{ a.link }}" target="_blank" rel="noopener"
         style="font-weight:700; color:var(--accent); text-decoration:none;">
        ler original →
      </a>
    </div>
  </article>
  {% endfor %}
</main>

<footer>
  <span>•</span> S.I. News · {{ filename }} <span>•</span>
</footer>

</body>
</html>
